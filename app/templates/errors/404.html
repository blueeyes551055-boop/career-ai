{% extends "base.html" %}
{% block title %}Page not found — {{ app_name }}{% endblock %}
{% block body %}
<div class="error-page">
  <div class="text-center">
    <div class="error-code">404</div>
    <h1 class="h4 mt-2">Page not found</h1>
    <p class="text-muted-2">The page you're looking for doesn't exist or has moved.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-navy mt-2"><i class="bi bi-house"></i> Back to home</a>
  </div>
</div>
{% endblock %}
