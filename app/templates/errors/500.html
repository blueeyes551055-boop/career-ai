{% extends "base.html" %}
{% block title %}Something went wrong — {{ app_name }}{% endblock %}
{% block body %}
<div class="error-page">
  <div class="text-center">
    <div class="error-code">500</div>
    <h1 class="h4 mt-2">Something went wrong</h1>
    <p class="text-muted-2">An unexpected error occurred. Please try again in a moment.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-navy mt-2"><i class="bi bi-house"></i> Back to home</a>
  </div>
</div>
{% endblock %}
